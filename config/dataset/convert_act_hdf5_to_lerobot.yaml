# @package _global_

# Hydra config for utils/convert_act_hdf5_to_lerobot.py.
# Select a dataset-specific config with, for example:
#   uv run python utils/convert_act_hdf5_to_lerobot.py dataset=tube overwrite=true
#   uv run python utils/convert_act_hdf5_to_lerobot.py dataset=apple overwrite=true

defaults:
  - dataset: tube
  - _self_

# Conversion behavior shared by all ACT/Aloha HDF5 datasets.
no_videos: True
overwrite: False
max_episodes: null

# LeRobot writer options.
tolerance_s: 1.0e-4
image_writer_processes: 8
image_writer_threads: 8
video_backend: null

# Raw HDF5 gripper action is a width: larger is more open, smaller is more
# closed. The converter writes action[13] as 1.0 for closed and 0.0 for open.
right_gripper_binarization:
  enabled: True

# Optional Hydra runtime settings if this file is used as the primary config.
hydra:
  run:
    dir: .
  output_subdir: null
